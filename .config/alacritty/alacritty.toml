[colors.cursor]
cursor = "0x93a1a1"
text = "0x002b36"

[colors.primary]
background = "#09090F"
foreground = '#d4be98'

# Normal colors
[colors.normal]
black   = '#32302f'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'

# Bright colors (same as normal colors)
[colors.bright]
black   = '#32302f'
red     = '#ea6962'
green   = '#a9b665'
yellow  = '#d8a657'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#89b482'
white   = '#d4be98'

[env]
TERM = "xterm-256color"

[terminal.shell]
program = '/usr/bin/zsh'
args = ['--login']

# [font]
# size = 11

[font.bold]
# family = "FiraCode Nerd Font"
family = "NotoMono Nerd Font Mono"
style = "Bold"

[font.bold_italic]
family = "NotoMono Nerd Font Mono"
# family = "FiraCode Nerd Font"
# family = "Noto Sans Mono"
# family = "Noto Sans Mono"
style = "Bold Italic"

[font.italic]
family = "NotoMono Nerd Font Mono"
# family = "FiraCode Nerd Font"
# family = "Noto Sans Mono"
# family = "Noto Sans Mono"
style = "Italic"

[font.normal]
family = "NotoMono Nerd Font Mono"
# family = "FiraCode Nerd Font"
# family = "Noto Sans Mono"
# family = "Noto Sans Mono"
style = "Regular"

[window]
opacity = 1 #0.85

[window.padding]
x = 30 #10 #30
y = 30 #10 #30

[cursor]
style = { blinking = "On" }
